# .github/workflows/build-glenda-windows.yml
name: Build Glenda Desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [release-v1.12.15-dev]

jobs:
  prepare:
    uses: ./.github/workflows/build-glenda-prepare.yaml

  build-windows:
    needs: prepare
    uses: ./.github/workflows/build_desktop_windows.yaml
    with:
      arch: x64
      sign: ''
      test: false
      targets: squirrel msi

  deploy-update-server:
      needs: build-windows
      runs-on: ubuntu-24.04
      steps:
        - name: Download artifacts
          uses: actions/download-artifact@v4
          with:
            name: win-x64

        - name: Prepare update server structure
          run: |
            mkdir -p update-server/win32/x64
            mkdir -p update-server/install/win32/x64
            # Squirrel update artifacts (what the running app polls)
            mv dist/squirrel-windows*/*.nupkg update-server/win32/x64/
            mv dist/squirrel-windows*/RELEASES  update-server/win32/x64/
            # Installer for first-time installs (optional, nice to have hosted)
            mv dist/squirrel-windows*/Element\ Setup*.exe update-server/install/win32/x64/
            mv dist/*.msi update-server/install/win32/x64/